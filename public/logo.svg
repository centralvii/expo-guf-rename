<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue" x1="30" y1="0" x2="50" y2="100">
      <stop offset="0%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="50" y1="0" x2="70" y2="100">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0098a8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0070f3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background ambient -->
  <circle cx="50" cy="50" r="44" fill="#0070f3" opacity="0.05"/>

  <!-- Left loop — Blue -->
  <path d="M 50 48 C 32 48, 22 26, 30 50 C 38 74, 44 52, 50 52"
        stroke="url(#blue)" stroke-width="11" stroke-linecap="round" fill="none" filter="url(#shadow)"/>

  <!-- Right loop — Cyan -->
  <path d="M 50 52 C 68 52, 78 74, 70 50 C 62 26, 56 48, 50 48"
        stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" fill="none" filter="url(#shadow)"/>

  <!-- Center accent -->
  <circle cx="50" cy="50" r="5" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
